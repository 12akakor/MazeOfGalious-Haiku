<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2a0"/>
      <stop offset="0.45" stop-color="#f2b81c"/>
      <stop offset="1" stop-color="#9c5a00"/>
    </linearGradient>
    <linearGradient id="field" x1="14" y1="10" x2="46" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#0d2a85"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="8" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a5a2a"/>
      <stop offset="1" stop-color="#4a230a"/>
    </linearGradient>
    <radialGradient id="shadow" cx="32" cy="59" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="20" y1="10" x2="30" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="32" cy="58.5" rx="22" ry="4" fill="url(#shadow)"/>

  <!-- sword blade behind the shield: outline, light upper half, darker lower half -->
  <path d="M 49 4.5 L 62 1.5 L 59 14.5 L 17.5 52 L 9 43.5 Z" fill="#232838"/>
  <path d="M 50.2 5.8 L 60.2 3.3 L 13.5 45.6 L 10.9 43.5 Z" fill="#ffffff"/>
  <path d="M 60.2 3.3 L 57.7 13.3 L 17.5 49.6 L 13.5 45.6 Z" fill="#a9b2c3"/>
  <path d="M 60.2 3.3 L 59.2 7.4 L 15.4 47.5 L 13.5 45.6 Z" fill="#d7dde8"/>
  <!-- shield: dark outline, gold rim, blue field -->
  <path d="M 9 9 Q 32 3 55 9 L 55 30 Q 54 47 32 60 Q 10 47 9 30 Z" fill="#1a1440"/>
  <path d="M 11 10.6 Q 32 5.2 53 10.6 L 53 30 Q 52 45.6 32 57.6 Q 12 45.6 11 30 Z" fill="url(#gold)"/>
  <path d="M 15 13.6 Q 32 9.4 49 13.6 L 49 30 Q 48 42.8 32 52.8 Q 16 42.8 15 30 Z" fill="url(#field)"/>

  <!-- golden meander (maze) emblem -->
  <path d="M 22 20 L 42 20 L 42 40 L 26 40 L 26 26 L 36 26 L 36 34 L 31 34 L 31 31 L 33 31 L 33 29 L 29 29 L 29 37 L 39 37 L 39 23 L 25 23 L 25 43.5 L 22 41.2 Z" fill="url(#gold)"/>
  <path d="M 22 20 L 42 20 L 42 40 L 26 40 L 26 26 L 36 26 L 36 34 L 31 34 L 31 31 L 33 31 L 33 29 L 29 29 L 29 37 L 39 37 L 39 23 L 25 23 L 25 43.5 L 22 41.2 Z" fill="none" stroke="#5a3200" stroke-width="0.8"/>

  <!-- gloss on the shield -->
  <path d="M 15 13.6 Q 32 9.4 49 13.6 L 49 18 Q 32 14 15 26 Z" fill="url(#gloss)"/>

  <!-- hilt in front: cross guard, grip, pommel -->
  <path d="M 6.5 40.5 L 10 37 L 27 54 L 23.5 57.5 Z" fill="#3a2200"/>
  <path d="M 7.8 40.5 L 10 38.3 L 25.7 54 L 23.5 56.2 Z" fill="url(#gold)"/>
  <path d="M 13.5 51 L 16.5 54 L 9.5 61 L 6.5 58 Z" fill="url(#grip)" stroke="#2a1200" stroke-width="0.8"/>
  <circle cx="6.5" cy="61" r="2.6" fill="url(#gold)" stroke="#3a2200" stroke-width="0.8"/>
</svg>
